<html>
<head>
<title>Math Function</title>
</head>
<body bgcolor="27F2F5">
<center>
<h1>Math Function</h1>
</center>
<script>
document.write("Square Root: " + Math.sqrt(64));
document.write("<p>Power: " + Math.pow(2,5) + "</p>");
document.write("<p>Floor: " + Math.floor(6.4) + "</p>");
document.write("<p>Ceil: " + Math.ceil(5.111) + "</p>");
document.write("<p>Round: " + Math.round(5.566) + "</p>");
</script>
</body>
</html>
